name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner (pinned)
        run: python -m pip install pytest==9.2.0
      - name: Tests (no network; all registry answers are fakes)
        run: python -m pytest -q
      - name: Installer dry run (isolated home)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DEPBOUNCER_HOME = "$env:RUNNER_TEMP\dbhome"
          $env:DEPBOUNCER_USER_HOME = "$env:RUNNER_TEMP\userhome"
          New-Item -ItemType Directory -Force "$env:DEPBOUNCER_USER_HOME\.claude" | Out-Null
          python -I src/launcher.py install --dry-run --no-path
